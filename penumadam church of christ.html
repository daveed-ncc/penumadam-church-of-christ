<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎉</title>
  <style>
    :root {
      --bg1: #ff7eb3;
      --bg2: #ffc75f;
      --bg3: #7ce7ff;
      --pink: #ff4d8d;
      --red: #ff5a5f;
      --gold: #ffd166;
      --blue: #53a6ff;
      --purple: #7b61ff;
      --green: #76e39d;
      --brown: #8d5e3b;
      --skin: #f7d4af;
      --shoe: #2d2d2d;
      --shadow: rgba(0, 0, 0, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
      user-select: none;
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      cursor: pointer;
    }

    .page {
      width: min(100%, 1100px);
      min-height: 90vh;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.34);
      border-radius: 28px;
      backdrop-filter: blur(6px);
      box-shadow: 0 26px 68px rgba(82, 44, 44, 0.2);
      padding: 24px 18px 40px;
      position: relative;
      overflow: hidden;
    }

    .sparkles, .balloons, .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sparkles span {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 14px rgba(255,255,255,0.8);
      animation: twinkle 2.2s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { transform: scale(0.3); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .balloon {
      position: absolute;
      bottom: -120px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 52px;
      height: 66px;
      border-radius: 50% 50% 46% 46%;
      box-shadow: inset -8px -8px 12px rgba(0,0,0,0.12);
      animation: floatUp 9s ease-in-out infinite;
    }

    .balloon::before {
      content: "";
      position: absolute;
      width: 2px;
      height: 70px;
      background: rgba(0,0,0,0.2);
      bottom: -68px;
      left: 50%;
      transform: translateX(-50%);
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      top: 10px;
      left: 10px;
    }

    .balloon:nth-child(1) { left: 8%; background: var(--pink); animation-delay: 0.1s; }
    .balloon:nth-child(2) { left: 18%; background: var(--gold); animation-delay: 1s; }
    .balloon:nth-child(3) { left: 63%; background: var(--blue); animation-delay: 2s; }
    .balloon:nth-child(4) { left: 75%; background: var(--green); animation-delay: 1.7s; }
    .balloon:nth-child(5) { left: 88%; background: var(--purple); animation-delay: 0.6s; }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-24px) rotate(8deg); }
    }

    .top-box {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 20px;
    }

    h1 {
      margin: 0;
      color: #fff7ff;
      font-size: clamp(2.2rem, 5vw, 4rem);
      text-shadow: 0 8px 25px rgba(98, 24, 62, 0.48);
      letter-spacing: 1px;
      animation: pulseText 2s ease-in-out infinite alternate;
    }

    @keyframes pulseText {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }

    .subtitle {
      margin-top: 10px;
      color: #fff6dc;
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 22px;
      margin-top: 28px;
      align-items: center;
    }

    .character-panel, .side-panel {
      background: rgba(255,255,255,0.17);
      border-radius: 24px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 15px rgba(255,255,255,0.12);
      padding: 18px;
    }

    .character-panel {
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .character {
      position: relative;
      width: 340px;
      height: 440px;
      animation: floatCharacter 3s ease-in-out infinite alternate;
    }

    @keyframes floatCharacter {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    .head {
      position: absolute;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      width: 190px;
      height: 200px;
      background: var(--skin);
      border-radius: 48% 48% 44% 44%;
      box-shadow: inset -12px -10px 0 rgba(188, 125, 90, 0.14);
      z-index: 3;
    }

    .hair {
      position: absolute;
      left: 50%;
      top: 26px;
      transform: translateX(-50%);
      width: 220px;
      height: 132px;
      background: #2d1f17;
      border-radius: 60% 60% 42% 42%;
      z-index: 4;
    }

    .hair::before, .hair::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2d1f17;
      top: 18px;
    }

    .hair::before { left: 20px; }
    .hair::after { right: 20px; }

    .eye {
      position: absolute;
      top: 130px;
      width: 40px;
      height: 52px;
      background: #fff;
      border-radius: 50%;
      z-index: 5;
      overflow: hidden;
    }

    .eye.left { left: 104px; }
    .eye.right { right: 104px; }

    .eye::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 24px;
      border-radius: 50%;
      background: #1f1f1f;
      left: 11px;
      top: 16px;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      left: 17px;
      top: 22px;
    }

    .nose {
      position: absolute;
      left: 50%;
      top: 158px;
      transform: translateX(-50%);
      width: 20px;
      height: 28px;
      background: #f1bf8d;
      border-radius: 50% 50% 54% 54%;
      z-index: 6;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 192px;
      transform: translateX(-50%);
      width: 70px;
      height: 40px;
      border-bottom: 5px solid #e25d5d;
      border-radius: 0 0 60px 60px;
      z-index: 6;
    }

    .blush {
      position: absolute;
      top: 170px;
      width: 28px;
      height: 18px;
      background: rgba(255, 110, 140, 0.7);
      border-radius: 50%;
      z-index: 5;
    }

    .blush.left { left: 83px; }
    .blush.right { right: 83px; }

    .body {
      position: absolute;
      left: 50%;
      top: 230px;
      transform: translateX(-50%);
      width: 160px;
      height: 178px;
      background: #f9d95d;
      border-radius: 25px 25px 22px 22px;
      z-index: 2;
    }

    .shirt {
      position: absolute;
      left: 50%;
      top: 256px;
      transform: translateX(-50%);
      width: 110px;
      height: 95px;
      background: #fff;
      border-radius: 18px;
      z-index: 3;
      overflow: hidden;
    }

    .shirt::before, .shirt::after {
      content: "";
      position: absolute;
      background: #ff5d7a;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      top: 15px;
    }

    .shirt::before { left: 18px; }
    .shirt::after { right: 18px; }

    .arm {
      position: absolute;
      top: 242px;
      width: 42px;
      height: 122px;
      background: var(--skin);
      border-radius: 30px;
      z-index: 1;
    }

    .arm.left {
      left: 78px;
      transform: rotate(32deg);
    }

    .arm.right {
      right: 78px;
      transform: rotate(-32deg);
    }

    .hand {
      position: absolute;
      top: 330px;
      width: 36px;
      height: 34px;
      background: var(--skin);
      border-radius: 50%;
      z-index: 3;
    }

    .hand.left { left: 60px; }
    .hand.right { right: 60px; }

    .leg {
      position: absolute;
      top: 392px;
      width: 44px;
      height: 88px;
      background: #f5bf7f;
      border-radius: 22px;
      z-index: 1;
    }

    .leg.left { left: 118px; }
    .leg.right { right: 118px; }

    .shoe {
      position: absolute;
      top: 468px;
      width: 58px;
      height: 24px;
      background: var(--shoe);
      border-radius: 24px;
      z-index: 2;
    }

    .shoe.left { left: 100px; }
    .shoe.right { right: 100px; }

    .cartoon-speech {
      position: absolute;
      right: 18px;
      top: 38px;
      background: rgba(255,255,255,0.85);
      color: #4a3c3c;
      font-weight: 700;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      animation: bounceSpeech 1.6s infinite alternate;
      font-size: 0.95rem;
    }

    .cartoon-speech::after {
      content: "";
      position: absolute;
      left: -10px;
      bottom: 14px;
      width: 18px;
      height: 18px;
      background: rgba(255,255,255,0.85);
      transform: rotate(45deg);
      border-radius: 4px;
    }

    @keyframes bounceSpeech {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .cake-box, .lock-box, .game-box {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 14px 16px;
    }

    .cake {
      position: relative;
      width: 120px;
      height: 118px;
      margin: 8px auto 0;
    }

    .cake-top {
      position: absolute;
      width: 120px;
      height: 18px;
      border-radius: 12px;
      background: #ffef9a;
      left: 0;
      top: 18px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    }

    .cake-body {
      position: absolute;
      left: 12px;
      top: 30px;
      width: 96px;
      height: 70px;
      background: linear-gradient(180deg, #ff8ca8, #f75d8a);
      border-radius: 10px 10px 14px 14px;
    }

    .cake-icing {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 22%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 38% 32%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 60% 25%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 80% 30%, #fff 0 8px, transparent 9px);
      opacity: 0.7;
    }

    .candle {
      position: absolute;
      width: 10px;
      height: 26px;
      background: #fff1ad;
      border-radius: 4px;
      left: 53px;
      top: 0;
    }

    .candle::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ffbf47;
      border-radius: 50%;
      left: -1px;
      top: -12px;
      box-shadow: 0 0 12px rgba(255,200,78,0.8);
      animation: flicker 0.8s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.2); }
    }

    .lock-box h3, .game-box h3 {
      margin: 0 0 12px;
      color: #fffaf4;
      font-size: 1.1rem;
      text-align: center;
    }

    .lock-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 78px;
      height: 78px;
      margin: 0 auto 10px;
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.18);
    }

    .lock-button::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border: 4px solid white;
      border-radius: 8px 8px 14px 14px;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
    }

    .lock-button::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 20px;
      border: 4px solid white;
      border-radius: 14px;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .lock-code {
      display: flex;
      justify-content: center;
      margin: 12px 0 14px;
    }

    .lock-code input {
      width: 100%;
      max-width: 180px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.12);
      color: white;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1.2rem;
      font-weight: 700;
      outline: none;
      letter-spacing: 2px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .keypad button {
      border: none;
      background: rgba(255,255,255,0.17);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .keypad button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.24);
    }

    .unlock-btn {
      width: 100%;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff5ea8, #ff7f50);
      color: white;
      font-weight: 800;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255,96,115,0.38);
    }

    .game-box {
      position: relative;
      overflow: hidden;
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      color: #fffef8;
      margin-bottom: 10px;
    }

    .game-area {
      position: relative;
      height: 180px;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(112,198,255,0.25), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,255,255,0.2);
      margin: 8px 0;
    }

    .balloonMini {
      position: absolute;
      width: 40px;
      height: 52px;
      border-radius: 50% 50% 48% 48%;
      border: 2px solid rgba(255,255,255,0.26);
      box-shadow: inset -10px -8px 10px rgba(0,0,0,0.08);
      animation: miniBop 1.7s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .balloonMini:hover {
      transform: scale(1.1);
    }

    .balloonMini::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: 18px;
      width: 2px;
      height: 18px;
      background: rgba(0,0,0,0.2);
    }

    @keyframes miniBop {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-8px) rotate(4deg); }
    }

    .winner-banner {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.9);
      color: #2a1b2d;
      font-weight: 900;
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.14);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .winner-banner.show { opacity: 1; }

    .secret-message {
      margin-top: 12px;
      color: #fff8d8;
      font-weight: 700;
      min-height: 22px;
      text-align: center;
      letter-spacing: 0.4px;
    }

    .vibe {
      animation: shakeVibe 0.2s linear 2;
    }

    @keyframes shakeVibe {
      0% { transform: translate(0,0) rotate(0deg); }
      25% { transform: translate(-6px,2px) rotate(-2deg); }
      50% { transform: translate(6px,-2px) rotate(2deg); }
      75% { transform: translate(-5px,1px) rotate(-1deg); }
      100% { transform: translate(0,0) rotate(0deg); }
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      opacity: 0.88;
      animation: fallConfetti 1.8s ease-in forwards;
    }

    @keyframes fallConfetti {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 1; }
      100% {
        transform: translateY(110vh) rotate(420deg);
        opacity: 0;
      }
    }

    @media (max-width: 820px) {
      .content {
        grid-template-columns: 1fr;
      }

      .character-panel { min-height: 430px; }
      .side-panel { order: 2; }
      .character-panel { order: 1; }
    }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="sparkles">
      <span style="left:10%; top:16%; animation-delay:0.2s"></span>
      <span style="left:22%; top:30%; animation-delay:0.9s"></span>
      <span style="left:42%; top:14%; animation-delay:0.4s"></span>
      <span style="left:68%; top:18%; animation-delay:1.1s"></span>
      <span style="left:82%; top:28%; animation-delay:0.7s"></span>
      <span style="left:90%; top:16%; animation-delay:1.3s"></span>
      <span style="left:57%; top:38%; animation-delay:0.5s"></span>
      <span style="left:13%; top:50%; animation-delay:1.5s"></span>
      <span style="left:74%; top:53%; animation-delay:0.8s"></span>
      <span style="left:35%; top:52%; animation-delay:1.2s"></span>
    </div>

    <div class="balloons">
      <div class="balloon"></div>
      <div class="balloon"></div>
      <div class="balloon"></div>
      <div class="balloon"></div>
      <div class="balloon"></div>
    </div>

    <div class="top-box">
      <h1>Happy Birthday! 🎉</h1>
      <div class="subtitle">You are the coolest person ever!</div>
    </div>

    <div class="content">
      <div class="character-panel">
        <div class="character">
          <div class="cartoon-speech">You are awesome!</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="hand left"></div>
          <div class="hand right"></div>
          <div class="body"></div>
          <div class="shirt"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
          <div class="shoe left"></div>
          <div class="shoe right"></div>
        </div>
      </div>

      <div class="side-panel">
        <div class="cake-box">
          <h3>Birthday Cake</h3>
          <div class="cake">
            <div class="candle"></div>
            <div class="cake-top"></div>
            <div class="cake-body">
              <div class="cake-icing"></div>
            </div>
          </div>
        </div>

        <div class="lock-box">
          <h3>Secret Lock</h3>
          <div class="lock-button"></div>

          <div class="lock-code">
            <input id="codeInput" type="text" maxlength="4" value="" readonly />
          </div>

          <div class="keypad">
            <button data-digit="1">1</button>
            <button data-digit="2">2</button>
            <button data-digit="3">3</button>
            <button data-digit="4">4</button>
            <button data-digit="5">5</button>
            <button data-digit="6">6</button>
            <button data-digit="7">7</button>
            <button data-digit="8">8</button>
            <button data-digit="9">9</button>
            <button data-clear="clear">C</button>
            <button data-digit="0">0</button>
            <button data-delete="delete">⌫</button>
          </div>

          <button class="unlock-btn" id="unlockBtn">Unlock Surprise</button>
          <div class="secret-message" id="secretMessage"></div>
        </div>
